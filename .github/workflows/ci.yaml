name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Run black
      run: black --check .

    - name: Run flake8
      run: flake8 .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      # internal
      API_URL: http://localhost:8000
      AUTH_SECRET: test-secret
      MONGO_URI: mongodb://localhost:27017/testdb
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ES_URL: http://localhost:9200
      DASH_URL: http://localhost:8050
      LOG_LEVEL: WARNING
      # external
      MUSE_API_KEY: dummy-key-for-tests
      MUSE_API_URL: https://api.example.com/muse
      ADZUNA_APP_ID: dummy-adzuna-id
      ADZUNA_APP_KEY: dummy-adzuna-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v tests

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build application Docker image
      run: docker build -t job-api:latest .